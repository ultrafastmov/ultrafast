[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
# The oldest Rust that builds it (cargo install says so on older ones).
rust-version = "1.91"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/ultrafastmov/ultrafast"
homepage = "https://ultrafast.mov"

[workspace.dependencies]
ultrafast-graph = { path = "crates/ultrafast-graph", version = "0.2.2" }
ultrafast-gpu = { path = "crates/ultrafast-gpu", version = "0.2.2" }
ultrafast-render = { path = "crates/ultrafast-render", version = "0.2.2" }
ultrafast-shaderc = { path = "crates/ultrafast-shaderc", version = "0.2.2" }
ultrafast-live = { path = "crates/ultrafast-live", version = "0.2.2" }
ultrafast-media = { path = "crates/ultrafast-media", version = "0.2.2" }
ultrafast-recon = { path = "crates/ultrafast-recon", version = "0.2.2" }
ultrafast-framing = { path = "crates/ultrafast-framing", version = "0.2.2" }
ultrafast-geom = { path = "crates/ultrafast-geom", version = "0.2.2" }
ultrafast-ops = { path = "crates/ultrafast-ops", version = "0.2.2" }
ultrafast-mcp = { path = "crates/ultrafast-mcp", version = "0.2.2", package = "ultrafastmov-mcp" }
ultrafast-service = { path = "crates/ultrafast-service", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
png = "0.18"

[profile.release]
debug = 1
lto = "thin"
