ultrafast-media.workspace = true
serde_json.workspace = true
png.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"

[dev-dependencies]
tiny_http = "0.12"
ultrafast-gpu.workspace = true
