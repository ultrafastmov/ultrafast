[package]
# `ultrafast-mcp` on crates.io is an unrelated MCP library; the code still
# imports this crate as `ultrafast_mcp`.
name = "ultrafastmov-mcp"
description = "ultrafast as Model Context Protocol tools: the stdio server behind `uf mcp` and the Streamable HTTP server that `uf serve` mounts at /mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "video", "agents", "model-context-protocol"]
categories = ["multimedia::video", "rendering"]

[lib]
name = "ultrafast_mcp"

[dependencies]
ultrafast-graph.workspace = true
ultrafast-render.workspace = true
ultrafast-ops.workspace = true
ultrafast-live.workspace = true
ultrafast-media.workspace = true
serde_json.workspace = true
png.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.23"

[dev-dependencies]
tiny_http = "0.12"
ultrafast-gpu.workspace = true
