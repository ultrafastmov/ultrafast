[package]
name = "ultrafast-mcp"
description = "ultrafast as Model Context Protocol tools: the stdio server behind `uf mcp` and the Streamable HTTP server, with OAuth for connectors, that the self-hosted service mounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "video", "agents", "model-context-protocol"]
